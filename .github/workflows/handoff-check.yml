name: Continuous handoff verification

on:
  push:
  pull_request:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: handoff-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install real browser
        id: browser-install
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Reproduce, validate and write next handoff
        run: npm run handoff:ci
      - name: Exercise all site functions if orchestration was interrupted
        if: always()
        run: |
          if [ ! -f test-output/site-check/result.json ]; then npm run site:check; fi
      - name: Keep evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-evidence-${{ github.run_id }}
          retention-days: 30
          path: |
            HANDOFF.json
            handoff/
            docs/handoff/current.md
            public/handoff-status.json
            test-output/handoff/
            test-output/chart-fixed.json
            test-output/chart-current.json
            test-output/bitcoin-ui.json
            test-output/bitcoin-ui-*.png
            docs/task5/bitcoin-chart/
      - name: Keep full site test evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: test-output/site-check/
      - name: Explain setup interruption
        if: failure()
        run: echo 'A failed/unfinished run is not completion. Download both handoff-evidence and site-check-evidence artifacts; missing real-site proof is UNVERIFIED.' >> "$GITHUB_STEP_SUMMARY"
