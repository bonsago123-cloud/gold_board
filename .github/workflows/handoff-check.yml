name: Continuous handoff verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: handoff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Active cycle fixed ten checks
        run: npm run handoff:ci
      - name: Regression checks
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
      - name: Preserve evidence including unfinished work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-evidence-${{ github.run_id }}
          retention-days: 30
          path: |
            HANDOFF.json
            docs/handoff/current.md
            docs/task5/chart-restart/
            handoff/restart/
            test-output/chart-restart.json
